[package]
name = "recorta"
version = "0.1.0"
edition = "2024"
description = "Editor de imagens: recortar, redimensionar e mudar a escala com qualidade"
license = "MIT"
repository = "https://github.com/1155dosilicon/recorta"
readme = "README.md"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "glow", "wayland", "x11"] }
# símbolos (📂 💾 ✂ ⟲ →) embutidos; sem isso dependem das fontes do sistema
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
image = { version = "0.25.10", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
rayon = "1.12.0"
rfd = "0.18.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# processamento de imagem fica lento demais sem otimização mesmo em debug
[profile.dev.package."*"]
opt-level = 3
